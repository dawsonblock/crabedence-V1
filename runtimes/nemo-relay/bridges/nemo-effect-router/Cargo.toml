# SPDX-License-Identifier: Apache-2.0

[package]
name = "nemo-effect-router"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Registry-pinned effect routing for the NeMo Relay kernel."
publish = false

[lints]
workspace = true

[dependencies]
nemo-crabedence-bridge = { path = "../nemo-crabedence" }
nemo-relay-executor = { workspace = true, features = ["unstable-hardening"] }
# Used by `testing`, which mints a verified catalog the same way the loader
# does; a routing assertion needs a catalog it controls.
base64 = "0.22"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
# The shared effect-state vocabulary the kernel's classifier returns. Used by
# tests to assert that a routed refusal reaches the state Crabedence reached.
nemo-relay-ledger = { workspace = true, features = ["unstable-hardening"] }
