# SPDX-License-Identifier: Apache-2.0

[package]
name = "nemo-crabedence-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A NeMo Relay runtime instance that routes capability invocations through the verified registry."
publish = false

[lints]
workspace = true

[[bin]]
name = "nemo-crabedence-runtime"
path = "src/main.rs"

[dependencies]
nemo-crabedence-bridge = { path = "../nemo-crabedence" }
nemo-effect-router = { path = "../nemo-effect-router" }
nemo-relay = { workspace = true }
nemo-relay-executor = { workspace = true, features = ["unstable-hardening"] }
nemo-relay-plugin-host = { workspace = true }
nemo-relay-plugin-protocol = { workspace = true }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { workspace = true, features = ["v7"] }
