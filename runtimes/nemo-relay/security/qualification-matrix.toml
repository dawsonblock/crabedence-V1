]
note = "Every platform whose package carries a plugin host now runs the check: the Node InstalledArtifact job covers linux amd64, linux arm64 and macOS arm64, and InstalledArtifactMusl covers both musl packages inside the alpine image they target; the Python side runs the same recipe against the linux arm64 and macOS arm64 wheels, and against both musllinux wheels inside the musllinux build image. The musl fixtures are built for the musl target on the runner and the verify scripts run under the container's own libc, because a musl addon cannot load under glibc. Windows ships no plugin-hosting package — the isolated runtime is not implemented there — so 'every packaged target' is every platform that carries a host."

