[package]
name = "nemo-effect-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable-effect kernel and production composition boundary for the experimental EffectStore."
publish = false

[lints]
workspace = true

[dependencies]
nemo-relay.workspace = true
nemo-relay-authority = { workspace = true, features = ["unstable-hardening"] }
nemo-relay-executor = { workspace = true, features = ["unstable-hardening"] }
nemo-relay-ledger = { workspace = true, features = ["unstable-postgres"] }
nemo-relay-plugin-protocol.workspace = true
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
