name: Release Qualification

on:
  push:
    branches:
      - release/crabedence-v1-hardening
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to qualify (defaults to HEAD)"
        required: false
        default: ""

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly -trimpath
  GOTOOLCHAIN: local

jobs:
  # ─── Provenance gate ──────────────────────────────────────────────────
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.record.outputs.commit }}
      tree: ${{ steps.record.outputs.tree }}
      branch: ${{ steps.record.outputs.branch }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify clean working tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)release-evidence/')" ]; then
            echo "ERROR: working tree is not clean"
            git status --porcelain
            exit 1
          fi

      - name: Record source provenance
        id: record
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

  # ─── Go tests (no race) ───────────────────────────────────────────────
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go formatting check
        run: |
          mapfile -t files < <(git ls-files '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            diff="$(gofmt -l "${files[@]}")"
            if [ -n "$diff" ]; then
              echo "$diff"
              exit 1
            fi
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests (uncached)
        run: go test -count=1 -timeout=15m ./internal/cli/ ./internal/capability/ ./internal/execution/ ./internal/idempotency/ ./internal/providers/shared/ ./internal/providers/tart/ ./internal/providers/lume/

  # ─── Go race tests ────────────────────────────────────────────────────
  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cli
            packages: ./internal/cli/
            pattern: "TestTerminalReceipt|TestTerminalLog|TestRunEvidence|TestFinalizeRun|TestEvidence|TestReceiptContract"
          - name: providers
            packages: ./internal/providers/tart/ ./internal/providers/lume/ ./internal/providers/shared/
            pattern: ""
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go race tests (${{ matrix.group.name }})
        run: |
          if [ -n "${{ matrix.group.pattern }}" ]; then
            go test -race -count=1 -timeout=20m -run "${{ matrix.group.pattern }}" ${{ matrix.group.packages }}
          else
            go test -race -count=1 -timeout=20m ${{ matrix.group.packages }}
          fi

  # ─── Worker tests ────────────────────────────────────────────────────
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Worker typecheck
        run: npm run check --prefix worker

      - name: Worker format check
        run: npm run format:check --prefix worker

      - name: Worker lint
        run: npm run lint --prefix worker

      - name: Worker tests
        run: npm test --prefix worker

      - name: Worker build
        run: npm run build --prefix worker

  # ─── Live PostgreSQL ────────────────────────────────────────────────
  postgres:
    name: PostgreSQL fencing + parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        test:
          - postgres-authority-fencing.live.test.ts
          - coordinator-parity.live.test.ts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Live PostgreSQL test (${{ matrix.test }})
        run: npx vitest run --no-file-parallelism test/${{ matrix.test }}

  # ─── NeMo tests ──────────────────────────────────────────────────────
  nemo:
    name: NeMo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: nemo/package-lock.json

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      - name: NeMo typecheck
        run: npx --prefix nemo tsc --noEmit

      - name: NeMo tests
        run: npx --prefix nemo vitest run

  # ─── Cross-language conformance ──────────────────────────────────────
  cross-language:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-language conformance
        run: go test -count=1 -timeout=60s -run "TestRunEvidenceConformanceCorpus|TestReceiptContractConformance" ./internal/cli/

  # ─── Evidence aggregation ────────────────────────────────────────────
  evidence:
    name: Release evidence + admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [provenance, go-tests, go-race, worker, postgres, nemo, cross-language]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      - name: Generate release evidence
        run: bash scripts/generate-release-evidence.sh

      - name: Check release admission
        run: bash scripts/check-release-admission.sh

      - name: Verify release artifact
        run: bash scripts/verify-release-artifact.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
