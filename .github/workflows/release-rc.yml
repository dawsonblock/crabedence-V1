name: Release RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0-rc.2)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOFLAGS: -mod=readonly -trimpath
  GOTOOLCHAIN: local

jobs:
  # ─── Provenance gate ──────────────────────────────────────────────────
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.record.outputs.commit }}
      tree: ${{ steps.record.outputs.tree }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify clean working tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)dist/')" ]; then
            echo "ERROR: working tree is not clean"
            git status --porcelain
            exit 1
          fi

      - name: Record source provenance
        id: record
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        shell: bash
        run: node scripts/verify-version-consistency.mjs --tag "${{ inputs.version }}"

  # ─── Go tests (no race) ───────────────────────────────────────────────
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go formatting check
        run: |
          mapfile -t files < <(git ls-files '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            diff="$(gofmt -l "${files[@]}")"
            if [ -n "$diff" ]; then
              echo "$diff"
              exit 1
            fi
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests (uncached)
        run: go test -count=1 -timeout=15m ./internal/cli/ ./internal/capability/ ./internal/execution/ ./internal/idempotency/ ./internal/providers/shared/ ./internal/providers/tart/ ./internal/providers/lume/

  # ─── Go race tests (parallel matrix) ─────────────────────────────────
  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cli
            packages: ./internal/cli/
            pattern: "TestTerminalReceipt|TestTerminalLog|TestRunEvidence|TestFinalizeRun|TestEvidence|TestReceiptContract"
          - name: execution
            packages: ./internal/capability/ ./internal/execution/ ./internal/idempotency/
            pattern: ""
          - name: providers
            packages: ./internal/providers/tart/ ./internal/providers/lume/ ./internal/providers/shared/
            pattern: ""
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go race tests (${{ matrix.group.name }})
        run: |
          if [ -n "${{ matrix.group.pattern }}" ]; then
            go test -race -count=1 -timeout=20m -run "${{ matrix.group.pattern }}" ${{ matrix.group.packages }}
          else
            go test -race -count=1 -timeout=20m ${{ matrix.group.packages }}
          fi

  # ─── Worker tests ────────────────────────────────────────────────────
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Worker typecheck
        run: npm run check --prefix worker

      - name: Worker format check
        run: npm run format:check --prefix worker

      - name: Worker lint
        run: npm run lint --prefix worker

      - name: Worker tests
        run: npm test --prefix worker

      - name: Worker build
        run: npm run build --prefix worker

  # ─── Live PostgreSQL (parallel matrix) ───────────────────────────────
  postgres:
    name: PostgreSQL fencing + parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        test:
          - postgres-authority-fencing.live.test.ts
          - coordinator-parity.live.test.ts
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Live PostgreSQL test (${{ matrix.test }})
        run: npx vitest run --no-file-parallelism test/${{ matrix.test }}

  # ─── NeMo tests ──────────────────────────────────────────────────────
  nemo:
    name: NeMo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: nemo/package-lock.json

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      - name: NeMo typecheck
        run: npx --prefix nemo tsc --noEmit

      - name: NeMo tests
        run: npx --prefix nemo vitest run

  # ─── Cross-language conformance ──────────────────────────────────────
  cross-language:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-language conformance
        run: go test -count=1 -timeout=60s -run "TestRunEvidenceConformanceCorpus|TestReceiptContractConformance" ./internal/cli/

  # ─── Build, finalize evidence, and attest (pre-publication) ─────────
  # Publication is a separate job: clean-room verification of the staged
  # bytes runs BEFORE the tag is pushed or the release is created, so a
  # bundle that does not survive outside the build environment can never
  # become public.
  build:
    name: Build, Attest, Stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [provenance, go-tests, go-race, worker, postgres, nemo, cross-language]
    outputs:
      release_version: ${{ env.RELEASE_VERSION }}
      tar_sha256: ${{ steps.artifact_hash.outputs.tar_sha256 }}
      zip_sha256: ${{ steps.artifact_hash.outputs.zip_sha256 }}
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NAME: crabedence-${{ inputs.version }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
      TREE: ${{ needs.provenance.outputs.tree }}
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.COMMIT }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      # ─── Generate release evidence ─────────────────────────────────────
      - name: Generate release evidence
        run: bash scripts/generate-release-evidence.sh

      - name: Check release admission
        run: bash scripts/check-release-admission.sh

      # ─── Build artifact from the same clean checkout ──────────────────
      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="crabedence-${RELEASE_VERSION}/" \
            -o "dist/crabedence-${RELEASE_VERSION}.tar.gz" HEAD
          git archive --format=zip --prefix="crabedence-${RELEASE_VERSION}/" \
            -o "dist/crabedence-${RELEASE_VERSION}.zip" HEAD

      - name: Calculate artifact SHA-256
        id: artifact_hash
        shell: bash
        run: |
          cd dist
          sha256sum "crabedence-${RELEASE_VERSION}.tar.gz" > "crabedence-${RELEASE_VERSION}.tar.gz.sha256"
          sha256sum "crabedence-${RELEASE_VERSION}.zip" > "crabedence-${RELEASE_VERSION}.zip.sha256"
          echo "tar_sha256=$(cut -d ' ' -f1 < "crabedence-${RELEASE_VERSION}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(cut -d ' ' -f1 < "crabedence-${RELEASE_VERSION}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Generate artifact.json
        shell: bash
        run: |
          # Bind the capability-policy identity into the artifact: the
          # registry digest is what the released service will serve, so
          # the evidence answers "which policy was this qualified
          # against?" without re-deriving it.
          REGISTRY_SHA256="$(go run ./cmd/registry-digest)"
          if [ -z "$REGISTRY_SHA256" ]; then
            echo "ERROR: capability registry digest is empty" >&2
            exit 1
          fi
          cat > dist/release-evidence/artifact.json << EOF
          {
            "name": "crabedence-${RELEASE_VERSION}.tar.gz",
            "sha256": "${{ steps.artifact_hash.outputs.tar_sha256 }}",
            "zip_name": "crabedence-${RELEASE_VERSION}.zip",
            "zip_sha256": "${{ steps.artifact_hash.outputs.zip_sha256 }}",
            "source_commit": "$COMMIT",
            "source_tree": "$TREE",
            "release_version": "$RELEASE_VERSION",
            "registry_sha256": "$REGISTRY_SHA256"
          }
          EOF

      # ─── Finalize the evidence bundle: artifact.json -> manifest ─────
      # artifact.json is written AFTER generate-release-evidence.sh ran,
      # so the bundle's SHA256SUMS and evidence-manifest.json do not cover
      # it yet. Finalization regenerates both so the artifact binding is
      # inside the final manifest — and a stale attestation reference is
      # removed, because it attested a superseded manifest.
      - name: Finalize release evidence
        run: bash scripts/finalize-release-evidence.sh dist/release-evidence

      # ─── Attest the FINAL evidence manifest ───────────────────────────
      # The attestation subject is the final evidence manifest, whose
      # digest covers SHA256SUMS, which in turn covers artifact.json and
      # every evidence file: the whole chain terminates in one signed
      # statement.
      - name: Extract qualification summary for attestation
        id: qual_summary
        run: |
          echo "release_name=$(jq -r '.release_name // "crabedence-rc"' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "gates=$(jq -r '.qualification.total_gates // 0' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status // "UNKNOWN"' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "promotable=$(jq -r '.artifact_promotable // false' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$(jq -r '.sha256' dist/release-evidence/evidence-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(jq -r '.sha256' dist/release-evidence/artifact.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub artifact attestation
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release-evidence/evidence-manifest.json
          predicate-type: https://crabedence.dev/attestation/release-qualification/v1
          predicate: |
            {
              "release_name": "${{ steps.qual_summary.outputs.release_name }}",
              "qualification_gates": ${{ steps.qual_summary.outputs.gates }},
              "qualification_status": "${{ steps.qual_summary.outputs.status }}",
              "artifact_promotable": ${{ steps.qual_summary.outputs.promotable }},
              "evidence_sha256": "${{ steps.qual_summary.outputs.evidence_sha256 }}",
              "artifact_sha256": "${{ steps.qual_summary.outputs.artifact_sha256 }}"
            }

      - name: Save attestation reference
        run: |
          mkdir -p dist/release-evidence/attestation
          echo '${{ steps.attestation.outputs.attestation-id }}' > dist/release-evidence/attestation/attestation-id.txt
          echo '${{ steps.attestation.outputs.attestation-url }}' > dist/release-evidence/attestation/attestation-url.txt
          cat > dist/release-evidence/attestation/attestation.json <<EOF
          {
            "tool": "github-actions-attest",
            "attestation_id": "${{ steps.attestation.outputs.attestation-id }}",
            "attestation_url": "${{ steps.attestation.outputs.attestation-url }}",
            "subject": "dist/release-evidence/evidence-manifest.json",
            "predicate_type": "https://crabedence.dev/attestation/release-qualification/v1",
            "evidence_sha256": "${{ steps.qual_summary.outputs.evidence_sha256 }}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ env.COMMIT }}"
          }
          EOF

      # ─── Verify release artifact (after finalization + attestation) ──
      - name: Verify release artifact
        run: |
          bash scripts/verify-release-artifact.sh \
            --mode release \
            --evidence dist/release-evidence \
            --source . \
            --archive "dist/crabedence-${RELEASE_VERSION}.tar.gz"

      # ─── Generate SBOM (fail-closed, pinned version) ──────────────────
      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p dist
          # Pin the cyclonedx-gomod version for reproducibility.
          # If installation or generation fails, the release FAILS —
          # we never attest a placeholder as a component inventory.
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.4.1
          cyclonedx-gomod mod -json -output "dist/crabedence-${RELEASE_VERSION}.bom.json" .
          if [ ! -s "dist/crabedence-${RELEASE_VERSION}.bom.json" ]; then
            echo "ERROR: cyclonedx-gomod produced empty SBOM" >&2
            exit 1
          fi
          echo "SBOM generated: $(jq '.components | length' dist/crabedence-${RELEASE_VERSION}.bom.json) components"

      # ─── GitHub artifact attestation (SLSA provenance) ────────────────
      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Attest zip archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.zip

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json

      # ─── Stage the verified bytes for clean-room verify and publish ──
      # Publication uploads exactly these staged files, so the bytes the
      # clean room verified are the bytes that become public.
      - name: Upload source archive (for clean-room verify and publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source-archive
          path: |
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json
          retention-days: 30

      - name: Upload release evidence (for clean-room verify and publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: dist/release-evidence/
          retention-days: 30

  # ─── Clean-room verification (pre-publication) ───────────────────────
  # Extract the STAGED archive into a fresh directory and verify it
  # without any Git checkout. This proves the artifact survives outside
  # the original build environment BEFORE the tag or the release exists:
  # a bundle that cannot be verified independently is never published.
  clean-room-verify:
    name: Clean-room verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-archive
          path: archive

      - name: Verify archive SHA-256
        run: |
          expected="$(cut -d ' ' -f1 < archive/crabedence-${RELEASE_VERSION}.tar.gz.sha256)"
          actual="$(sha256sum archive/crabedence-${RELEASE_VERSION}.tar.gz | cut -d ' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "SHA-256 mismatch: expected=$expected actual=$actual"
            exit 1
          fi
          echo "Archive SHA-256 verified: $actual"

      - name: Extract archive into clean directory
        run: |
          mkdir -p clean-room
          tar xzf "archive/crabedence-${RELEASE_VERSION}.tar.gz" -C clean-room

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # The verifier must not depend on a mutable global validator. The
      # archive ships its own lockfile, so install the exactly-pinned
      # dependency from the extracted source.
      - name: Install pinned verification dependencies
        run: npm ci --prefix "clean-room/crabedence-${RELEASE_VERSION}/nemo"

      - name: Verify release artifact (standalone, no .git)
        run: |
          # Copy evidence bundle alongside extracted source
          cp -r evidence clean-room/qualification
          # Run the verifier against the extracted source with the
          # explicit release contract: the archive digest is recomputed
          # from the staged bytes, artifact.json must bind it, the final
          # manifest must cover it, and the registry digest is recomputed
          # from the envelope. The verifier uses find (not git) so it
          # works without .git
          bash clean-room/crabedence-${RELEASE_VERSION}/scripts/verify-release-artifact.sh \
            --mode release \
            --evidence clean-room/qualification \
            --source clean-room/crabedence-${RELEASE_VERSION} \
            --archive "archive/crabedence-${RELEASE_VERSION}.tar.gz"

  # ─── Publish (only after clean-room verification passed) ─────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [provenance, build, clean-room-verify]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
      TREE: ${{ needs.provenance.outputs.tree }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.COMMIT }}

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-archive
          path: dist

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: dist/release-evidence

      # The published bytes must be the verified bytes. The archive is
      # recomputed here against the digest the build job reported — a
      # staging mismatch stops publication instead of shipping unverified
      # bytes.
      - name: Verify staged archive before publication
        run: |
          expected="${{ needs.build.outputs.tar_sha256 }}"
          actual="$(sha256sum "dist/crabedence-${RELEASE_VERSION}.tar.gz" | cut -d ' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "ERROR: staged archive SHA-256 $actual does not match the verified $expected" >&2
            exit 1
          fi
          echo "Staged archive matches the verified digest: $actual"

      # ─── Tag the release candidate ────────────────────────────────────
      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "Crabedence Release Bot"
          git config user.email "release@crabedence.dev"

      - name: Tag release candidate
        shell: bash
        run: |
          git tag -a "$RELEASE_VERSION" -m "Crabedence $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      # ─── Publish as GitHub prerelease ────────────────────────────────
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Crabedence ${{ env.RELEASE_VERSION }}
          prerelease: true
          body: |
            ## Crabedence ${{ env.RELEASE_VERSION }}

            ### Source provenance
            - **Commit:** `${{ env.COMMIT }}`
            - **Tree:** `${{ env.TREE }}`
            - **Branch:** `${{ github.ref_name }}`

            ### Artifact hashes
            - **tar.gz SHA-256:** `${{ needs.build.outputs.tar_sha256 }}`
            - **zip SHA-256:** `${{ needs.build.outputs.zip_sha256 }}`

            ### Verification
            See [VERIFY-RELEASE.md](./VERIFY-RELEASE.md) for instructions on how to verify this release artifact.

            ```bash
            # Verify artifact attestation
            gh attestation verify dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz \
              --repo ${{ github.repository }}
            ```

            ### Qualification
            All mandatory gates passed. See `qualification.json` for the exact gate count and per-gate status.
          files: |
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json
            dist/release-evidence/qualification.json
            dist/release-evidence/qualification-matrix.md
            dist/release-evidence/source-tree-sha256.txt
            dist/release-evidence/provenance.json
            dist/release-evidence/artifact.json
            dist/release-evidence/evidence-manifest.json
            dist/release-evidence/registry.sha256
            dist/release-evidence/registry.json
            dist/release-evidence/attestation/attestation.json
            dist/release-evidence/SHA256SUMS

  # ─── Public reverify (distribution integrity) ────────────────────────
  # After publication, download the PUBLIC bytes and verify them against
  # the qualified evidence. This answers "did the distribution system
  # publish the same bytes we qualified?" — it does not control whether
  # the release exists (the pre-publication clean room made that
  # decision), but a mismatch fails the workflow loudly.
  public-reverify:
    name: Public reverify (distribution integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, publish]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Download published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          gh release download "$RELEASE_VERSION" \
            --repo ${{ github.repository }} \
            --pattern "crabedence-${RELEASE_VERSION}.tar.gz" \
            --pattern "crabedence-${RELEASE_VERSION}.tar.gz.sha256" \
            --pattern "artifact.json" \
            --pattern "evidence-manifest.json" \
            --pattern "SHA256SUMS" \
            --dir public

      - name: Verify published archive matches the qualified digest
        run: |
          qualified="${{ needs.build.outputs.tar_sha256 }}"
          actual="$(sha256sum "public/crabedence-${RELEASE_VERSION}.tar.gz" | cut -d ' ' -f1)"
          published="$(cut -d ' ' -f1 < "public/crabedence-${RELEASE_VERSION}.tar.gz.sha256")"
          if [ "$actual" != "$qualified" ] || [ "$published" != "$qualified" ]; then
            echo "ERROR: published archive digest $actual / declared $published does not match the qualified $qualified" >&2
            exit 1
          fi
          echo "Published archive matches the qualified digest: $actual"

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence

      - name: Verify published evidence files match the qualified bundle
        run: |
          for file in artifact.json evidence-manifest.json SHA256SUMS; do
            if ! cmp -s "public/$file" "evidence/$file"; then
              echo "ERROR: published $file differs from the qualified evidence bundle" >&2
              exit 1
            fi
          done

      - name: Extract published archive
        run: |
          mkdir -p clean-room
          tar xzf "public/crabedence-${RELEASE_VERSION}.tar.gz" -C clean-room

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pinned verification dependencies
        run: npm ci --prefix "clean-room/crabedence-${RELEASE_VERSION}/nemo"

      - name: Verify published artifact (standalone, no .git)
        run: |
          cp -r evidence clean-room/qualification
          bash clean-room/crabedence-${RELEASE_VERSION}/scripts/verify-release-artifact.sh \
            --mode release \
            --evidence clean-room/qualification \
            --source clean-room/crabedence-${RELEASE_VERSION} \
            --archive "public/crabedence-${RELEASE_VERSION}.tar.gz"

      - name: Verify published attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "public/crabedence-${RELEASE_VERSION}.tar.gz" \
            --repo ${{ github.repository }}
