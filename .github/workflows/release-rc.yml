name: Release RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0-rc.2)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOFLAGS: -mod=readonly -trimpath
  GOTOOLCHAIN: local

jobs:
  # ─── Provenance gate ──────────────────────────────────────────────────
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.record.outputs.commit }}
      tree: ${{ steps.record.outputs.tree }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify clean working tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)dist/')" ]; then
            echo "ERROR: working tree is not clean"
            git status --porcelain
            exit 1
          fi

      - name: Record source provenance
        id: record
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        shell: bash
        run: node scripts/verify-version-consistency.mjs --tag "${{ inputs.version }}"

  # ─── Go tests (no race) ───────────────────────────────────────────────
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go formatting check
        run: |
          mapfile -t files < <(git ls-files '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            diff="$(gofmt -l "${files[@]}")"
            if [ -n "$diff" ]; then
              echo "$diff"
              exit 1
            fi
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests (uncached)
        run: go test -count=1 -timeout=15m ./internal/cli/ ./internal/capability/ ./internal/execution/ ./internal/idempotency/ ./internal/providers/shared/ ./internal/providers/tart/ ./internal/providers/lume/

  # ─── Go race tests (parallel matrix) ─────────────────────────────────
  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: cli
            packages: ./internal/cli/
            pattern: "TestTerminalReceipt|TestTerminalLog|TestRunEvidence|TestFinalizeRun|TestEvidence|TestReceiptContract"
          - name: execution
            packages: ./internal/capability/ ./internal/execution/ ./internal/idempotency/
            pattern: ""
          - name: providers
            packages: ./internal/providers/tart/ ./internal/providers/lume/ ./internal/providers/shared/
            pattern: ""
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go race tests (${{ matrix.group.name }})
        run: |
          if [ -n "${{ matrix.group.pattern }}" ]; then
            go test -race -count=1 -timeout=20m -run "${{ matrix.group.pattern }}" ${{ matrix.group.packages }}
          else
            go test -race -count=1 -timeout=20m ${{ matrix.group.packages }}
          fi

  # ─── Worker tests ────────────────────────────────────────────────────
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Worker typecheck
        run: npm run check --prefix worker

      - name: Worker format check
        run: npm run format:check --prefix worker

      - name: Worker lint
        run: npm run lint --prefix worker

      - name: Worker tests
        run: npm test --prefix worker

      - name: Worker build
        run: npm run build --prefix worker

  # ─── Live PostgreSQL (parallel matrix) ───────────────────────────────
  postgres:
    name: PostgreSQL fencing + parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        test:
          - postgres-authority-fencing.live.test.ts
          - coordinator-parity.live.test.ts
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Live PostgreSQL test (${{ matrix.test }})
        run: npx vitest run --no-file-parallelism test/${{ matrix.test }}

  # ─── NeMo tests ──────────────────────────────────────────────────────
  nemo:
    name: NeMo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: nemo/package-lock.json

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      - name: NeMo typecheck
        run: cd nemo && npx tsc --noEmit

      - name: NeMo tests
        run: cd nemo && npx vitest run

  # ─── Cross-language conformance ──────────────────────────────────────
  cross-language:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provenance
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.provenance.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-language conformance
        run: go test -count=1 -timeout=60s -run "TestRunEvidenceConformanceCorpus|TestReceiptContractConformance" ./internal/cli/

  # ─── Build, finalize evidence, and attest (pre-publication) ─────────
  # Publication is a separate job: clean-room verification of the staged
  # bytes runs BEFORE the tag is pushed or the release is created, so a
  # bundle that does not survive outside the build environment can never
  # become public.
  build:
    name: Build, Attest, Stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [provenance, go-tests, go-race, worker, postgres, nemo, cross-language]
    outputs:
      release_version: ${{ env.RELEASE_VERSION }}
      tar_sha256: ${{ steps.artifact_hash.outputs.tar_sha256 }}
      zip_sha256: ${{ steps.artifact_hash.outputs.zip_sha256 }}
      evidence_archive_sha256: ${{ steps.evidence_bundle.outputs.sha256 }}
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: crabbox
          POSTGRES_PASSWORD: crabbox
          POSTGRES_DB: crabbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NAME: crabedence-${{ inputs.version }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
      TREE: ${{ needs.provenance.outputs.tree }}
      CRABBOX_TEST_DATABASE_URL: postgres://crabbox:crabbox@localhost:5432/crabbox_test
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.COMMIT }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: worker/package.json
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Install NeMo dependencies
        run: npm ci --prefix nemo

      # ─── Generate release evidence ─────────────────────────────────────
      - name: Generate release evidence
        run: bash scripts/generate-release-evidence.sh

      - name: Check release admission
        run: bash scripts/check-release-admission.sh

      # ─── Build artifact from the same clean checkout ──────────────────
      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="crabedence-${RELEASE_VERSION}/" \
            -o "dist/crabedence-${RELEASE_VERSION}.tar.gz" HEAD
          git archive --format=zip --prefix="crabedence-${RELEASE_VERSION}/" \
            -o "dist/crabedence-${RELEASE_VERSION}.zip" HEAD

      - name: Calculate artifact SHA-256
        id: artifact_hash
        shell: bash
        run: |
          cd dist
          sha256sum "crabedence-${RELEASE_VERSION}.tar.gz" > "crabedence-${RELEASE_VERSION}.tar.gz.sha256"
          sha256sum "crabedence-${RELEASE_VERSION}.zip" > "crabedence-${RELEASE_VERSION}.zip.sha256"
          echo "tar_sha256=$(cut -d ' ' -f1 < "crabedence-${RELEASE_VERSION}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(cut -d ' ' -f1 < "crabedence-${RELEASE_VERSION}.zip.sha256")" >> "$GITHUB_OUTPUT"

      # ─── Generate SBOM (fail-closed, pinned version) ──────────────────
      # The SBOM is generated BEFORE artifact.json so the release object
      # can bind its digest.
      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p dist
          # Pin the cyclonedx-gomod version for reproducibility.
          # If installation or generation fails, the release FAILS —
          # we never attest a placeholder as a component inventory.
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.4.1
          cyclonedx-gomod mod -json -output "dist/crabedence-${RELEASE_VERSION}.bom.json" .
          if [ ! -s "dist/crabedence-${RELEASE_VERSION}.bom.json" ]; then
            echo "ERROR: cyclonedx-gomod produced empty SBOM" >&2
            exit 1
          fi
          echo "SBOM generated: $(jq '.components | length' dist/crabedence-${RELEASE_VERSION}.bom.json) components"

      # ─── Generate artifact.json (schema version 2) ────────────────────
      # The final release object: release identity, source identity (with
      # the manifest digest), the archive binding (filename/size/SHA-256),
      # and the digests of every evidence object the artifact was
      # qualified against. Every digest here is recomputed from the bytes
      # at verification time; none of them is trusted as a string.
      - name: Generate artifact.json
        shell: bash
        run: |
          # Bind the capability-policy identity into the artifact: the
          # registry digest is what the released service will serve, so
          # the evidence answers "which policy was this qualified
          # against?" without re-deriving it.
          REGISTRY_SHA256="$(go run ./cmd/registry-digest)"
          if [ -z "$REGISTRY_SHA256" ]; then
            echo "ERROR: capability registry digest is empty" >&2
            exit 1
          fi
          QUAL_SHA="$(sha256sum dist/release-evidence/qualification.json | cut -d ' ' -f1)"
          QUAL_SCHEMA="$(jq -r '.schema_version' dist/release-evidence/qualification.json)"
          MANIFEST_SHA="$(sha256sum dist/release-evidence/source-tree-sha256.txt | cut -d ' ' -f1)"
          PROV_SHA="$(sha256sum dist/release-evidence/provenance.json | cut -d ' ' -f1)"
          SBOM_SHA="$(sha256sum "dist/crabedence-${RELEASE_VERSION}.bom.json" | cut -d ' ' -f1)"
          ARCHIVE_SIZE="$(wc -c < "dist/crabedence-${RELEASE_VERSION}.tar.gz" | tr -d ' ')"
          jq -n \
            --arg release "$RELEASE_VERSION" \
            --arg commit "$COMMIT" \
            --arg tree "$TREE" \
            --arg manifest_sha "$MANIFEST_SHA" \
            --arg tar_name "crabedence-${RELEASE_VERSION}.tar.gz" \
            --arg tar_sha "${{ steps.artifact_hash.outputs.tar_sha256 }}" \
            --argjson tar_size "$ARCHIVE_SIZE" \
            --arg zip_name "crabedence-${RELEASE_VERSION}.zip" \
            --arg zip_sha "${{ steps.artifact_hash.outputs.zip_sha256 }}" \
            --arg registry_sha "$REGISTRY_SHA256" \
            --arg qual_sha "$QUAL_SHA" \
            --argjson qual_schema "$QUAL_SCHEMA" \
            --arg sbom_sha "$SBOM_SHA" \
            --arg prov_sha "$PROV_SHA" \
            --arg go_version "$(go version | awk '{print $3}')" \
            --arg node_version "$(node --version)" \
            --arg npm_version "$(npm --version)" \
            '{
              schema_version: 2,
              release: $release,
              source: { commit: $commit, tree: $tree, manifest_sha256: $manifest_sha },
              artifact: {
                filename: $tar_name, sha256: $tar_sha, size: $tar_size,
                zip_filename: $zip_name, zip_sha256: $zip_sha
              },
              policy: { registry_sha256: $registry_sha },
              qualification: { sha256: $qual_sha, schema_version: $qual_schema },
              sbom: { sha256: $sbom_sha },
              provenance: { sha256: $prov_sha },
              toolchain: { go: $go_version, node: $node_version, npm: $npm_version }
            }' > dist/release-evidence/artifact.json

      # ─── Finalize the evidence bundle: artifact.json -> manifest ─────
      # artifact.json is written AFTER generate-release-evidence.sh ran,
      # so the bundle's SHA256SUMS and evidence-manifest.json do not cover
      # it yet. Finalization regenerates both so the artifact binding is
      # inside the final manifest — and a stale attestation reference is
      # removed, because it attested a superseded manifest.
      - name: Finalize release evidence
        run: bash scripts/finalize-release-evidence.sh dist/release-evidence

      # ─── Package the complete finalized evidence bundle ──────────────
      # The public bundle is the WHOLE finalized tree, not an allow-list.
      # SHA256SUMS covers every evidence file, so publishing a subset
      # would leave the published set unable to verify itself. The digest
      # is computed once here and carried through every later stage; the
      # evidence directory is never mutated after this point.
      - name: Package release evidence bundle
        id: evidence_bundle
        shell: bash
        run: |
          sha="$(bash scripts/package-release-evidence.sh \
            dist/release-evidence \
            "dist/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz")"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Evidence bundle SHA-256: $sha"

      # ─── Attest the FINAL evidence manifest ───────────────────────────
      # The attestation subject is the final evidence manifest, whose
      # digest covers SHA256SUMS, which in turn covers artifact.json and
      # every evidence file: the whole chain terminates in one signed
      # statement.
      - name: Extract qualification summary for attestation
        id: qual_summary
        run: |
          echo "release_name=$(jq -r '.release_name // "crabedence-rc"' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "gates=$(jq -r '.qualification.total_gates // 0' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status // "UNKNOWN"' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "promotable=$(jq -r '.artifact_promotable // false' dist/release-evidence/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$(jq -r '.sha256' dist/release-evidence/evidence-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(jq -r '.artifact.sha256' dist/release-evidence/artifact.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub artifact attestation
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release-evidence/evidence-manifest.json
          predicate-type: https://crabedence.dev/attestation/release-qualification/v1
          predicate: |
            {
              "release_name": "${{ steps.qual_summary.outputs.release_name }}",
              "qualification_gates": ${{ steps.qual_summary.outputs.gates }},
              "qualification_status": "${{ steps.qual_summary.outputs.status }}",
              "artifact_promotable": ${{ steps.qual_summary.outputs.promotable }},
              "evidence_sha256": "${{ steps.qual_summary.outputs.evidence_sha256 }}",
              "artifact_sha256": "${{ steps.qual_summary.outputs.artifact_sha256 }}"
            }

      - name: Save attestation reference
        run: |
          mkdir -p dist/release-evidence/attestation
          echo '${{ steps.attestation.outputs.attestation-id }}' > dist/release-evidence/attestation/attestation-id.txt
          echo '${{ steps.attestation.outputs.attestation-url }}' > dist/release-evidence/attestation/attestation-url.txt
          cat > dist/release-evidence/attestation/attestation.json <<EOF
          {
            "tool": "github-actions-attest",
            "attestation_id": "${{ steps.attestation.outputs.attestation-id }}",
            "attestation_url": "${{ steps.attestation.outputs.attestation-url }}",
            "subject": "dist/release-evidence/evidence-manifest.json",
            "predicate_type": "https://crabedence.dev/attestation/release-qualification/v1",
            "evidence_sha256": "${{ steps.qual_summary.outputs.evidence_sha256 }}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ env.COMMIT }}"
          }
          EOF

      # ─── Verify release artifact (after finalization + attestation) ──
      - name: Verify release artifact
        run: |
          bash scripts/verify-release-artifact.sh \
            --mode release \
            --evidence dist/release-evidence \
            --source . \
            --archive "dist/crabedence-${RELEASE_VERSION}.tar.gz" \
            --zip "dist/crabedence-${RELEASE_VERSION}.zip" \
            --sbom "dist/crabedence-${RELEASE_VERSION}.bom.json"

      # Artifact attestations are created only AFTER the clean-room job
      # has verified the staged bytes (see the attest job), so nothing is
      # signed before it has been independently verified.

      # ─── Stage the verified bytes for clean-room verify and publish ──
      # Publication uploads exactly these staged files, so the bytes the
      # clean room verified are the bytes that become public.
      - name: Upload source archive (for clean-room verify and publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source-archive
          path: |
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json
            dist/crabedence-${{ env.RELEASE_VERSION }}-release-evidence.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}-release-evidence.tar.gz.sha256
          retention-days: 30

      - name: Upload release evidence (for clean-room verify and publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: dist/release-evidence/
          retention-days: 30

  # ─── Clean-room verification (pre-publication) ───────────────────────
  # Extract the STAGED archive into a fresh directory and verify it
  # without any Git checkout. This proves the artifact survives outside
  # the original build environment BEFORE the tag or the release exists:
  # a bundle that cannot be verified independently is never published.
  clean-room-verify:
    name: Clean-room verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: evidence

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-archive
          path: archive

      # Both archives are official artifacts with their own identity. Each
      # digest is recomputed from the staged bytes and compared against
      # the build output AND the declared checksum file — a mismatch in
      # either stops the workflow.
      - name: Verify every staged digest
        run: |
          check() {
            local file="$1" expected="$2" actual declared
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            declared="$(cut -d ' ' -f1 < "${file}.sha256")"
            if [ "$actual" != "$expected" ] || [ "$declared" != "$expected" ]; then
              echo "ERROR: $file digest $actual / declared $declared does not match the build output $expected" >&2
              exit 1
            fi
            echo "$file verified: $actual"
          }
          check "archive/crabedence-${RELEASE_VERSION}.tar.gz" "${{ needs.build.outputs.tar_sha256 }}"
          check "archive/crabedence-${RELEASE_VERSION}.zip" "${{ needs.build.outputs.zip_sha256 }}"
          check "archive/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" "${{ needs.build.outputs.evidence_archive_sha256 }}"

      # Extract each archive into its OWN directory — never one over the
      # other — so each is verified from its own bytes.
      - name: Extract both archives
        run: |
          mkdir -p clean-room/tar-source clean-room/zip-source
          tar xzf "archive/crabedence-${RELEASE_VERSION}.tar.gz" -C clean-room/tar-source
          unzip -q "archive/crabedence-${RELEASE_VERSION}.zip" -d clean-room/zip-source

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # The verifier must not depend on a mutable global validator. The
      # archive ships its own lockfile, so install the exactly-pinned
      # dependency from the extracted source.
      - name: Install pinned verification dependencies
        run: |
          # Install OUTSIDE the extracted source. The verifier walks the
          # source tree to prove it equals the packaged archive, so an
          # install inside it would add node_modules the archive does not
          # contain. The verifier resolves ajv from the parent directory.
          mkdir -p clean-room/nemo
          cp "clean-room/tar-source/crabedence-${RELEASE_VERSION}/nemo/package.json" \
             "clean-room/tar-source/crabedence-${RELEASE_VERSION}/nemo/package-lock.json" clean-room/nemo/
          npm ci --prefix clean-room/nemo

      # Each extracted tree must independently reproduce the source
      # manifest: same path inventory, same types, same modes, same
      # regular-file bytes, same symlink target bytes.
      - name: Verify both source trees against the source manifest
        run: |
          cp -r evidence clean-room/qualification
          for tree in tar-source zip-source; do
            src="clean-room/${tree}/crabedence-${RELEASE_VERSION}"
            echo "=== source manifest: $tree ==="
            bash "$src/scripts/verify-source-manifest.sh" \
              clean-room/qualification/source-tree-sha256.txt "$src"
          done

      # Beyond each matching the manifest, the two archives must carry the
      # SAME normalized source inventory — this catches format-specific
      # packaging drift (mode loss, symlink flattening, dropped entries).
      - name: Require tar/ZIP semantic source equivalence
        run: |
          normalize() {
            local root="$1"
            find "$root" -mindepth 1 \( -type f -o -type l \) -print0 \
              | while IFS= read -r -d '' path; do
                  local rel="${path#"$root"/}"
                  if [ -L "$path" ]; then
                    printf 'symlink 120000 %s %s\n' \
                      "$(printf '%s' "$(readlink "$path")" | shasum -a 256 | cut -d ' ' -f1)" "$rel"
                  else
                    local mode=100644
                    [ -x "$path" ] && mode=100755
                    printf 'file %s %s %s\n' "$mode" "$(shasum -a 256 "$path" | cut -d ' ' -f1)" "$rel"
                  fi
                done | LC_ALL=C sort
          }
          normalize "clean-room/tar-source/crabedence-${RELEASE_VERSION}" > /tmp/tar.norm
          normalize "clean-room/zip-source/crabedence-${RELEASE_VERSION}" > /tmp/zip.norm
          if ! diff -u /tmp/tar.norm /tmp/zip.norm; then
            echo "ERROR: tar and zip source inventories differ" >&2
            exit 1
          fi
          echo "tar and zip carry identical source inventories ($(wc -l < /tmp/tar.norm | tr -d ' ') entries)"

      - name: Verify release artifact (standalone, no .git)
        run: |
          # Run the verifier against the extracted source with the
          # explicit release contract: both archive digests are recomputed
          # from the staged bytes, artifact.json must bind them, the final
          # manifest must cover the artifact binding, and the registry
          # digest is recomputed from the envelope.
          bash clean-room/tar-source/crabedence-${RELEASE_VERSION}/scripts/verify-release-artifact.sh \
            --mode release \
            --evidence clean-room/qualification \
            --source clean-room/tar-source/crabedence-${RELEASE_VERSION} \
            --archive "archive/crabedence-${RELEASE_VERSION}.tar.gz" \
            --zip "archive/crabedence-${RELEASE_VERSION}.zip" \
            --sbom "archive/crabedence-${RELEASE_VERSION}.bom.json"

  # ─── Attest (only after clean-room verification passed) ──────────────
  # Artifact attestations are signatures over the exact bytes the clean
  # room verified: nothing is attested before the staged artifact has
  # been independently verified.
  attest:
    name: Attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, clean-room-verify]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-archive
          path: dist

      # Never trust the delivered filenames: recompute every digest
      # immediately before signing and compare against the qualified
      # identities the build job reported. A mismatch stops attestation.
      - name: Recompute staged digests before attestation
        run: |
          check() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: $file digest $actual does not match the qualified $expected" >&2
              exit 1
            fi
            echo "$file: $actual"
          }
          check "dist/crabedence-${RELEASE_VERSION}.tar.gz" "${{ needs.build.outputs.tar_sha256 }}"
          check "dist/crabedence-${RELEASE_VERSION}.zip" "${{ needs.build.outputs.zip_sha256 }}"
          check "dist/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" "${{ needs.build.outputs.evidence_archive_sha256 }}"

      # ─── GitHub artifact attestation (SLSA provenance) ────────────────
      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Attest zip archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.zip

      - name: Attest release evidence bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}-release-evidence.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json

  # ─── Publish (only after clean-room verification passed) ─────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [provenance, build, clean-room-verify, attest]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
      TREE: ${{ needs.provenance.outputs.tree }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.COMMIT }}

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-archive
          path: dist

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: dist/release-evidence

      # The published bytes must be the verified bytes. The archive is
      # recomputed here against the digest the build job reported — a
      # staging mismatch stops publication instead of shipping unverified
      # bytes.
      - name: Verify staged artifacts before publication
        run: |
          check() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: staged $file SHA-256 $actual does not match the verified $expected" >&2
              exit 1
            fi
            echo "Staged $file matches the verified digest: $actual"
          }
          check "dist/crabedence-${RELEASE_VERSION}.tar.gz" "${{ needs.build.outputs.tar_sha256 }}"
          check "dist/crabedence-${RELEASE_VERSION}.zip" "${{ needs.build.outputs.zip_sha256 }}"
          check "dist/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" "${{ needs.build.outputs.evidence_archive_sha256 }}"

      # ─── Tag the release candidate ────────────────────────────────────
      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "Crabedence Release Bot"
          git config user.email "release@crabedence.dev"

      - name: Tag release candidate
        shell: bash
        run: |
          git tag -a "$RELEASE_VERSION" -m "Crabedence $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      # ─── Publish as GitHub prerelease ────────────────────────────────
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Crabedence ${{ env.RELEASE_VERSION }}
          prerelease: true
          body: |
            ## Crabedence ${{ env.RELEASE_VERSION }}

            ### Source provenance
            - **Commit:** `${{ env.COMMIT }}`
            - **Tree:** `${{ env.TREE }}`
            - **Branch:** `${{ github.ref_name }}`

            ### Artifact hashes
            - **tar.gz SHA-256:** `${{ needs.build.outputs.tar_sha256 }}`
            - **zip SHA-256:** `${{ needs.build.outputs.zip_sha256 }}`
            - **release-evidence.tar.gz SHA-256:** `${{ needs.build.outputs.evidence_archive_sha256 }}`

            ### Verification
            See [VERIFY-RELEASE.md](./VERIFY-RELEASE.md) for instructions on how to verify this release artifact.

            ```bash
            # Verify artifact attestation
            gh attestation verify dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz \
              --repo ${{ github.repository }}
            ```

            ### Qualification
            All mandatory gates passed. See `qualification.json` for the exact gate count and per-gate status.
          # The COMPLETE finalized evidence tree ships as one immutable
          # archive. Publishing a hand-maintained subset would leave the
          # published set unable to verify itself: SHA256SUMS references
          # every evidence file, so a partial upload cannot be checked.
          files: |
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip
            dist/crabedence-${{ env.RELEASE_VERSION }}.zip.sha256
            dist/crabedence-${{ env.RELEASE_VERSION }}.bom.json
            dist/crabedence-${{ env.RELEASE_VERSION }}-release-evidence.tar.gz
            dist/crabedence-${{ env.RELEASE_VERSION }}-release-evidence.tar.gz.sha256

  # ─── Public reverify (distribution integrity) ────────────────────────
  # After publication, download the PUBLIC bytes and verify them against
  # the qualified evidence. This answers "did the distribution system
  # publish the same bytes we qualified?" — it does not control whether
  # the release exists (the pre-publication clean room made that
  # decision), but a mismatch fails the workflow loudly.
  public-reverify:
    name: Public reverify (distribution integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, publish]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
    steps:
      # PUBLIC ASSETS ONLY. This job must never read the internal Actions
      # evidence artifact: it must prove the release is self-verifying
      # from exactly the files an external user can download. If it cannot
      # pass with the workflow artifact store deleted, RC1 is not done.
      - name: Download published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          gh release download "$RELEASE_VERSION" \
            --repo ${{ github.repository }} \
            --pattern "crabedence-${RELEASE_VERSION}.tar.gz" \
            --pattern "crabedence-${RELEASE_VERSION}.tar.gz.sha256" \
            --pattern "crabedence-${RELEASE_VERSION}.zip" \
            --pattern "crabedence-${RELEASE_VERSION}.zip.sha256" \
            --pattern "crabedence-${RELEASE_VERSION}.bom.json" \
            --pattern "crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" \
            --pattern "crabedence-${RELEASE_VERSION}-release-evidence.tar.gz.sha256" \
            --dir public

      - name: Verify public digests
        run: |
          check() {
            local file="$1" expected="$2" actual declared
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            declared="$(cut -d ' ' -f1 < "${file}.sha256")"
            if [ "$actual" != "$expected" ] || [ "$declared" != "$expected" ]; then
              echo "ERROR: published $file digest $actual / declared $declared does not match the qualified $expected" >&2
              exit 1
            fi
            echo "published $file matches the qualified digest: $actual"
          }
          check "public/crabedence-${RELEASE_VERSION}.tar.gz" "${{ needs.build.outputs.tar_sha256 }}"
          check "public/crabedence-${RELEASE_VERSION}.zip" "${{ needs.build.outputs.zip_sha256 }}"
          check "public/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" "${{ needs.build.outputs.evidence_archive_sha256 }}"

      # The evidence bundle is extracted to clean-room/qualification so the
      # verifier resolves its pinned validator from clean-room/nemo (the
      # directory it searches is the parent of the evidence directory).
      - name: Extract the public evidence bundle and both archives
        run: |
          mkdir -p clean-room/qualification clean-room/tar-source clean-room/zip-source
          tar xzf "public/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" \
            -C clean-room/qualification --strip-components=1
          tar xzf "public/crabedence-${RELEASE_VERSION}.tar.gz" -C clean-room/tar-source
          unzip -q "public/crabedence-${RELEASE_VERSION}.zip" -d clean-room/zip-source

      - name: Verify the public evidence bundle self-checks
        run: |
          cd clean-room/qualification
          shasum -a 256 -c SHA256SUMS

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pinned verification dependencies
        run: |
          # Install OUTSIDE the extracted source. The verifier walks the
          # source tree to prove it equals the packaged archive, so an
          # install inside it would add node_modules the archive does not
          # contain. The verifier resolves ajv from the parent directory.
          mkdir -p clean-room/nemo
          cp "clean-room/tar-source/crabedence-${RELEASE_VERSION}/nemo/package.json" \
             "clean-room/tar-source/crabedence-${RELEASE_VERSION}/nemo/package-lock.json" clean-room/nemo/
          npm ci --prefix clean-room/nemo

      - name: Verify both public source trees
        run: |
          for tree in tar-source zip-source; do
            src="clean-room/${tree}/crabedence-${RELEASE_VERSION}"
            echo "=== source manifest: $tree ==="
            bash "$src/scripts/verify-source-manifest.sh" \
              clean-room/qualification/source-tree-sha256.txt "$src"
          done

      - name: Verify published artifact from public assets only
        run: |
          bash clean-room/tar-source/crabedence-${RELEASE_VERSION}/scripts/verify-release-artifact.sh \
            --mode release \
            --evidence clean-room/qualification \
            --source clean-room/tar-source/crabedence-${RELEASE_VERSION} \
            --archive "public/crabedence-${RELEASE_VERSION}.tar.gz" \
            --zip "public/crabedence-${RELEASE_VERSION}.zip" \
            --sbom "public/crabedence-${RELEASE_VERSION}.bom.json"

      - name: Verify published attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "public/crabedence-${RELEASE_VERSION}.tar.gz" \
            --repo ${{ github.repository }}
          gh attestation verify "public/crabedence-${RELEASE_VERSION}.zip" \
            --repo ${{ github.repository }}
          gh attestation verify "public/crabedence-${RELEASE_VERSION}-release-evidence.tar.gz" \
            --repo ${{ github.repository }}
